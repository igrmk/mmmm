[pycodestyle]
max-line-length = 120

[flake8]
max-line-length = 120

[metadata]
name = gammon
author = igrmk
author_email = igrmkx@gmail.com
description = Google My Maps to Organic Maps KML converter
long_description_content_type = text/markdown
url = https://github.com/igrmk/gammon
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages=find:
python_requires = >= 3.0
install_requires =
    lxml
    importlib_metadata; python_version < "3.8"

[options.entry_points]
console_scripts = gammon = gammon._main:_main

